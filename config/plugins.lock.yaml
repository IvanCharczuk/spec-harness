# RF-19 madre: allowlist de plugins con versión/hash pineado. Plugin sin
# entrada acá no se monta.
plugins:
  - name: "@repo-maestro/dsh-frontend"
    version: "0.1.0"
    # Paquete local (dsh-plugins/dsh-frontend/), no publicado a un
    # registro — no hay artefacto externo del que tomar un hash real, así
    # que la referencia de "versión exacta" (RF-19) es el path dentro de
    # este mismo repo, no un hash de paquete.
    path: "dsh-plugins/dsh-frontend"
